  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    // EffectComposer removed — it renders to an opaque framebuffer
    // which blocks the transparent canvas from showing the US background

    const COUNT = 20000;
    const SPEED_MULT = 1;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.004);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 100);

    const canvas = document.getElementById('koi-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    // disable manual interaction — it's a background
    controls.enableRotate = false;
    controls.enableZoom = false;
    controls.enablePan = false;

    // Render directly — no post-processing needed

    const dummy = new THREE.Object3D();
    const color = new THREE.Color();
    const target = new THREE.Vector3();

    const geometry = new THREE.TetrahedronGeometry(0.25);
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff });

    const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
    instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(instancedMesh);

    const positions = [];
    for (let i = 0; i < COUNT; i++) {
      positions.push(new THREE.Vector3(
        (Math.random() - 0.5) * 100,
        (Math.random() - 0.5) * 100,
        (Math.random() - 0.5) * 100
      ));
      instancedMesh.setColorAt(i, color.setHex(0x00ff88));
    }

    const PARAMS = { speed: 0.8, pond: 80, size: 6, undul: 1.2, depth: 100 };

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime() * SPEED_MULT;

      controls.update();

      const count = COUNT;
      for (let i = 0; i < COUNT; i++) {
        const speed = PARAMS.speed;
        const pond  = PARAMS.pond;
        const sz    = PARAMS.size;
        const undul = PARAMS.undul;
        const depth = PARAMS.depth;

        const NF  = 12;
        const ppf = Math.floor(count / NF);
        const fi  = Math.min(Math.floor(i / ppf), NF - 1);
        const li  = i - fi * ppf;
        const PI  = 3.14159265;
        const TAU = PI * 2.0;

        const bodyN   = Math.floor(ppf * 0.60);
        const caudalN = Math.floor(ppf * 0.14);
        const dorsalN = Math.floor(ppf * 0.08);
        const pectLN  = Math.floor(ppf * 0.06);
        const pectRN  = Math.floor(ppf * 0.06);
        const analN   = Math.floor(ppf * 0.04);
        const barbelN = ppf - bodyN - caudalN - dorsalN - pectLN - pectRN - analN;

        const bodyEnd   = bodyN;
        const caudalEnd = bodyEnd + caudalN;
        const dorsalEnd = caudalEnd + dorsalN;
        const pectLEnd  = dorsalEnd + pectLN;
        const pectREnd  = pectLEnd + pectRN;
        const analEnd   = pectREnd + analN;

        const swimPh  = fi * 2.71828 + time * speed;
        const breathPh = time * 1.8 + fi * 3.7;

        const ga    = li * 2.39996322;
        const seed  = ((li * 73 + 17) % 131) / 131.0;
        const rr    = Math.sqrt(seed);
        const cosGa = Math.cos(ga);
        const sinGa = Math.sin(ga);

        let lx = 0, ly = 0, lz = 0;
        let finFlag = 0, spotT = 0;

        if (li < bodyEnd) {
          const t = li / bodyN;
          spotT = t;
          const snout     = Math.max(0, 1 - t * 8) * 0.3;
          const mainShape = Math.pow(Math.sin(t * PI), 0.55);
          const peak      = Math.exp(-Math.pow((t - 0.32) * 2.8, 2)) * 0.15;
          const belly     = Math.max(0, Math.sin(t * PI * 1.1 - 0.2)) * 0.08;
          const profile   = (mainShape + peak - snout) * sz * 0.28;
          const breathScale = 1 + Math.sin(breathPh + t * 2) * 0.02;
          const rx = profile * 1.15 * breathScale;
          const ry = (profile + belly * sz) * breathScale;
          lx = (t - 0.28) * sz * 3;
          ly = cosGa * rr * ry;
          lz = sinGa * rr * rx;
        } else if (li < caudalEnd) {
          const ci = li - bodyEnd;
          const t  = ci / caudalN;
          finFlag = 1; spotT = 0.88 + t * 0.12;
          const fan    = t * 0.7 + 0.08;
          const spread = Math.sin(t * PI) * sz * 0.55;
          const tailFlap = Math.sin(swimPh * 3.5 - 1.5) * 0.3 * (0.3 + t);
          const seedC  = ((ci * 59 + 23) % 97) / 97;
          const edgePos = (seedC - 0.5) * 2;
          lx = sz * 1.85 + fan * sz * 0.9;
          ly = edgePos * spread * (1 + Math.abs(Math.sin(t * PI * 2)) * 0.3);
          lz = tailFlap * sz * 0.2 + Math.sin(edgePos * PI) * t * 0.15 * sz;
        } else if (li < dorsalEnd) {
          const di = li - caudalEnd;
          const t  = di / dorsalN;
          finFlag = 0.7; spotT = 0.25 + t * 0.35;
          const height    = Math.sin(t * PI) * sz * 0.38;
          const seedD     = ((di * 41 + 11) % 79) / 79;
          const dorsalWave = Math.sin(swimPh * 2 + t * 3) * 0.08 * sz;
          lx = (t * 0.55 + 0.15 - 0.28) * sz * 3;
          ly = sz * 0.28 * Math.pow(Math.sin(spotT * PI), 0.55) + seedD * height;
          lz = dorsalWave * seedD;
        } else if (li < pectLEnd) {
          const pi2 = li - dorsalEnd;
          const t   = pi2 / pectLN;
          finFlag = 0.5; spotT = 0.18;
          const flapAngle = Math.sin(swimPh * 2.2 + 0.5) * 0.55 + 0.4;
          const seedP = ((pi2 * 67 + 7) % 89) / 89;
          const finLen = t * sz * 0.5;
          lx = (-0.28 + 0.22) * sz * 3 + Math.cos(flapAngle) * finLen * 0.3;
          ly = -sz * 0.06 - Math.sin(flapAngle) * finLen * seedP * 0.8;
          lz = -sz * 0.22 - finLen * seedP * Math.cos(flapAngle) * 0.7;
        } else if (li < pectREnd) {
          const pi3 = li - pectLEnd;
          const t   = pi3 / pectRN;
          finFlag = 0.5; spotT = 0.18;
          const flapAngle = Math.sin(swimPh * 2.2 + 0.5) * 0.55 + 0.4;
          const seedP = ((pi3 * 67 + 7) % 89) / 89;
          const finLen = t * sz * 0.5;
          lx = (-0.28 + 0.22) * sz * 3 + Math.cos(flapAngle) * finLen * 0.3;
          ly = -sz * 0.06 - Math.sin(flapAngle) * finLen * seedP * 0.8;
          lz =  sz * 0.22 + finLen * seedP * Math.cos(flapAngle) * 0.7;
        } else if (li < analEnd) {
          const ai = li - pectREnd;
          const t  = ai / analN;
          finFlag = 0.6; spotT = 0.7 + t * 0.1;
          const seedA  = ((ai * 53 + 31) % 71) / 71;
          const analH  = Math.sin(t * PI) * sz * 0.18;
          const analWave = Math.sin(swimPh * 2.5 + t * 2) * 0.06 * sz;
          lx = (0.55 + t * 0.15 - 0.28) * sz * 3;
          ly = -sz * 0.22 * Math.pow(Math.sin((0.7 + t * 0.1) * PI), 0.55) - seedA * analH;
          lz = analWave * seedA;
        } else {
          const bi   = li - analEnd;
          const side = (bi % 2) * 2 - 1;
          const t    = bi / Math.max(1, barbelN);
          finFlag = 0.3; spotT = 0;
          const barbelDroop = t * 0.15 * sz;
          const barbelSway  = Math.sin(swimPh * 1.5 + side) * 0.04 * sz;
          lx = -0.28 * sz * 3 - t * sz * 0.25;
          ly = -sz * 0.05 - barbelDroop;
          lz = side * sz * 0.06 + barbelSway;
        }

        // S-curve undulation
        const normX   = (lx / (sz * 3)) + 0.28;
        const waveAmp = undul * normX * normX * 0.7;
        const waveOff = Math.sin(normX * 8 - swimPh * 3.5) * waveAmp * sz * 0.15;
        const wave2   = Math.sin(normX * 12 - swimPh * 3.5 + 1) * waveAmp * sz * 0.04;
        lz += waveOff + wave2;

        // Swimming path
        const orbitT  = time * speed * 0.18 + fi * TAU / NF;
        const orbitRx = pond * (0.15 + fi * 0.06);
        const orbitRz = pond * (0.12 + fi * 0.05);
        const pathX   = Math.cos(orbitT) * orbitRx + Math.sin(orbitT * 0.6 + fi) * orbitRx * 0.12;
        const pathZ   = Math.sin(orbitT * 1.2 + fi * 0.7) * orbitRz;
        const yBase   = ((fi + 0.5) / NF - 0.5) * depth;
        const yDrift1 = Math.sin(time * 0.15 + fi * 3.1) * depth * 0.08;
        const yDrift2 = Math.sin(time * 0.08 + fi * 1.7) * depth * 0.05;
        const yNose   = Math.sin(time * speed * 0.4 + fi * 2.3) * 1.2;
        const pathY   = yBase + yDrift1 + yDrift2 + yNose;

        // Heading + banking
        const dt   = 0.012;
        const oT2  = orbitT + dt;
        const pX2  = Math.cos(oT2) * orbitRx + Math.sin(oT2 * 0.6 + fi) * orbitRx * 0.12;
        const pZ2  = Math.sin(oT2 * 1.2 + fi * 0.7) * orbitRz;
        const ddx0 = pX2 - pathX;
        const ddz0 = pZ2 - pathZ;
        const hLen = Math.sqrt(ddx0 * ddx0 + ddz0 * ddz0) + 0.0001;
        const hx   = -ddx0 / hLen;
        const hz   = -ddz0 / hLen;

        const oT3      = orbitT + dt * 2;
        const pX3      = Math.cos(oT3) * orbitRx + Math.sin(oT3 * 0.6 + fi) * orbitRx * 0.12;
        const pZ3      = Math.sin(oT3 * 1.2 + fi * 0.7) * orbitRz;
        const curvature = hx * ((pZ3 - pZ2) - ddz0) - hz * ((pX3 - pX2) - ddx0);
        const roll      = curvature * 18;
        const cosR      = Math.cos(roll);
        const sinR      = Math.sin(roll);
        const ly2       = ly * cosR - lz * sinR;
        const lz2       = ly * sinR + lz * cosR;

        const wx = pathX + lx * hx + lz2 * hz;
        const wy = pathY + ly2;
        const wz = pathZ + lx * hz - lz2 * hx;

        target.set(wx, wy, wz);

        // Coloring — Kohaku (pearl/crimson) & Asagi (slate-indigo)
        const typeB = fi % 2;
        const n1 = Math.sin(spotT * 23 + fi * 5.7) * Math.cos(ga * 2.7 + fi * 2.3);
        const n2 = Math.sin(spotT * 11.3 + ga * 1.3 + fi * 9) * 0.45;
        const n3 = Math.sin(spotT * 37 + fi * 17) * 0.2;
        const spotRaw  = n1 + n2 + n3;
        const spotMask = Math.min(1, Math.max(0, (spotRaw - 0.15) * 3));
        const finFade  = 1 - finFlag * 0.35;
        const finSat   = 1 - finFlag * 0.55;

        const hA = 0 + spotMask * 0.02;
        const sA = spotMask * 0.85 * finSat;
        const lA = (0.96 - spotMask * 0.46) * finFade;

        const hB = 0.6 - spotMask * 0.03;
        const sB = (0.5 + spotMask * 0.3) * finSat;
        const lB = (0.58 - spotMask * 0.32) * finFade;

        const h = hA + (hB - hA) * typeB;
        const s = sA + (sB - sA) * typeB;
        const l = lA + (lB - lA) * typeB;
        color.setHSL(h, s, l);

        positions[i].lerp(target, 0.1);
        dummy.position.copy(positions[i]);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);
        instancedMesh.setColorAt(i, color);
      }

      instancedMesh.instanceMatrix.needsUpdate = true;
      instancedMesh.instanceColor.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
